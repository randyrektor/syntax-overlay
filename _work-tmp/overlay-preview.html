<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay message preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Scene behind overlay (like a stream) */
body{
  font-family:'Space Grotesk',system-ui,sans-serif;
  min-height:100vh;
  background:linear-gradient(145deg,#1a1530 0%,#0d0d12 45%,#151820 100%);
  color:#f7f6f2;
  -webkit-font-smoothing:antialiased;
}
#output{
  position:absolute;
  bottom:30px;
  left:15px;
  right:15px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}
/* Stepped shadows = connected extrusion (no corner gap). */
.msg{
  position:relative;
  padding:22px 24px 22px 100px;
  width:fit-content;
  max-width:100%;
  background:#141413;
  border:2px solid #454441;
  border-radius:8px;
  box-shadow:
    1px 1px 0 0 #050504,2px 2px 0 0 #050504,3px 3px 0 0 #050504,4px 4px 0 0 #050504,5px 5px 0 0 #050504,
    6px 6px 0 0 #050504,7px 7px 0 0 #050504,8px 8px 0 0 #050504,9px 9px 0 0 #050504,10px 10px 0 0 #050504;
  min-height:80px;
  margin-bottom:14px;
}
.msg[data-type="twitch"]{
  border-color:#6b3fd4;
  box-shadow:
    1px 1px 0 0 #4c1fa8,2px 2px 0 0 #4c1fa8,3px 3px 0 0 #4c1fa8,4px 4px 0 0 #4c1fa8,5px 5px 0 0 #4c1fa8,
    6px 6px 0 0 #4c1fa8,7px 7px 0 0 #4c1fa8,8px 8px 0 0 #4c1fa8,9px 9px 0 0 #4c1fa8,10px 10px 0 0 #4c1fa8;
}
.avatar-wrap{
  position:absolute;
  top:0;left:0;
  width:80px;height:80px;
  background:#1e1e1d;
  border:2px solid #4a4946;
  border-radius:50%;
  overflow:hidden;
  z-index:3;
}
.msg[data-type="twitch"] .avatar-wrap{border-color:#8b6fe6}
.avatar-wrap img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.name-tag{
  position:absolute;
  top:-14px;left:70px;
  width:max-content;
  max-width:none;
  background:#1a1918;
  border:2px solid #5c5a55;
  border-radius:6px;
  padding:6px 12px;
  font-family:'Space Mono',monospace;
  font-weight:700;
  font-size:14px;
  color:#ffd54a;
  text-transform:uppercase;
  letter-spacing:.04em;
  z-index:4;
  box-shadow:1px 1px 0 0 #0a0a09,2px 2px 0 0 #0a0a09,3px 3px 0 0 #0a0a09,4px 4px 0 0 #0a0a09;
}
.name-tag-row{
  display:flex;
  flex-direction:row;
  flex-wrap:nowrap;
  align-items:center;
  gap:6px;
  white-space:nowrap;
}
.msg[data-type="twitch"] .name-tag{color:#e4d4ff;border-color:#8b6fe6;background:#120a24;box-shadow:1px 1px 0 0 #2d1566,2px 2px 0 0 #2d1566,3px 3px 0 0 #2d1566,4px 4px 0 0 #2d1566}
.name-text{display:inline-block;vertical-align:middle;white-space:nowrap;flex-shrink:0}
.badges-inline{display:inline-flex;align-items:center;gap:4px;flex-shrink:0;max-height:22px}
.chat-badge{height:18px;width:auto;max-height:18px;object-fit:contain;display:inline-block;vertical-align:middle}
.source-badge{
  font-family:'Space Mono',monospace;
  font-size:11px;
  font-weight:600;
  color:#c9c6bc;
  letter-spacing:.04em;
  flex-shrink:0;
}
.msg-text{
  font-size:28px;
  font-weight:500;
  line-height:1.45;
  letter-spacing:-.01em;
  color:#f7f6f2;
  word-break:break-word;
}
.msg-text a{color:#5eead4;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.preview-note{
  position:fixed;
  top:16px;
  left:16px;
  font-family:'Space Mono',monospace;
  font-size:12px;
  color:#8a879c;
  max-width:320px;
  line-height:1.5;
}
</style>
</head>
<body>
<p class="preview-note">Top: narrow “hi” card (regression for name row). Bottom: long message. CSS matches index.html.</p>
<div id="output">
  <div class="msg" data-type="twitch">
    <div class="avatar-wrap">
      <img src="https://i.pravatar.cc/160?u=guest" width="160" height="160" alt="">
    </div>
    <div class="name-tag">
      <div class="name-tag-row">
        <span class="name-text">_NEWGUEST()</span>
        <span class="badges-inline"><img class="chat-badge" src="https://static-cdn.jtvnw.net/badges/v1/5527c58c-fb7d-422d-b71b-f309dcb85cc1/1" alt=""><img class="chat-badge" src="https://static-cdn.jtvnw.net/badges/v1/b817aba4-fad8-49e2-b88a-7cc744dfb6f0/1" alt=""><img class="chat-badge" src="https://static-cdn.jtvnw.net/badges/v1/36d7e829-e304-452e-8a60-096a29020972/1" alt=""></span>
        <span class="source-badge">#twitch</span>
      </div>
    </div>
    <div class="msg-text">hi</div>
  </div>
  <div class="msg" data-type="twitch">
    <div class="avatar-wrap">
      <img src="https://i.pravatar.cc/160?u=vdo" width="160" height="160" alt="">
    </div>
    <div class="name-tag">
      <div class="name-tag-row">
        <span class="name-text">_VDO.NINJA()</span>
        <span class="badges-inline"><img class="chat-badge" src="https://static-cdn.jtvnw.net/badges/v1/bd444ec6-8c34-487b-a29d-76a3b79d2789/1" alt=""></span>
        <span class="source-badge">#twitch</span>
      </div>
    </div>
    <div class="msg-text">What do you call someone with no nose? Nobody knows.</div>
  </div>
</div>
</body>
</html>
