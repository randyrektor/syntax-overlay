<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syntax — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Space Grotesk',system-ui,sans-serif;
  background:#0a0a09;
  color:#f7f6f2;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ── HEADER ── */
#admin-header{
  flex-shrink:0;
  display:flex;
  align-items:stretch;
  background:#141413;
  border-bottom:2px solid #050504;
  box-shadow:0 4px 0 0 #050504;
  position:relative;
  z-index:10;
  min-height:54px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 22px;
  border-right:1px solid #2a2a28;
  font-family:'Space Mono',monospace;
  font-weight:700;
  font-size:13px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#ffd54a;
  flex-shrink:0;
}
.brand-mark{
  width:14px;
  height:14px;
  border-radius:3px;
  background:#ffd54a;
  box-shadow:1px 1px 0 0 #050504,2px 2px 0 0 #050504;
}

.tabs{
  display:flex;
  align-items:stretch;
}
.tab{
  font-family:'Space Mono',monospace;
  font-weight:700;
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:0 22px;
  background:transparent;
  border:none;
  border-right:1px solid #2a2a28;
  color:#8a8883;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:10px;
  position:relative;
  transition:background .12s ease,color .12s ease;
}
.tab:hover{background:#1a1918;color:#f7f6f2}
.tab.is-active{
  background:#1a1918;
  color:#ffd54a;
}
.tab.is-active::after{
  content:'';
  position:absolute;
  left:0;right:0;bottom:-2px;
  height:2px;
  background:#ffd54a;
}

.header-spacer{flex:1}

.session-pill{
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 16px;
  border-left:1px solid #2a2a28;
  font-family:'Space Mono',monospace;
  font-size:11px;
  letter-spacing:.08em;
  color:#8a8883;
  text-transform:uppercase;
}
.session-pill code{
  font-family:'Space Mono',monospace;
  font-weight:700;
  color:#ffd54a;
  background:#1a1918;
  padding:4px 8px;
  border-radius:4px;
  border:1px solid #2a2a28;
  text-transform:none;
  letter-spacing:.04em;
}

.obs-link{
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 22px;
  background:transparent;
  border:none;
  border-left:1px solid #2a2a28;
  font-family:'Space Mono',monospace;
  font-weight:700;
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#c9c6bc;
  cursor:pointer;
  transition:background .12s ease,color .12s ease;
}
.obs-link:hover{background:#1a1918;color:#ffd54a}
.obs-link.is-copied{color:#7be09a}

/* ── BODY ── */
#admin-body{
  flex:1;
  position:relative;
  background:#0e0e0d;
  overflow:hidden;
}
iframe.tab-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:none;
  background:#0e0e0d;
  display:none;
}
iframe.tab-frame.is-active{display:block}

/* ── MOBILE / NARROW ── */
@media (max-width: 720px){
  .session-pill{display:none}
  .tab{padding:0 14px;font-size:11px}
  .brand{padding:0 14px;font-size:12px}
  .obs-link{padding:0 14px;font-size:10px}
}
</style>
</head>
<body>
<header id="admin-header">
  <div class="brand">
    <span class="brand-mark"></span>
    Syntax Admin
  </div>
  <nav class="tabs" id="tabs">
    <button type="button" class="tab is-active" data-tab="lower-thirds" data-frame="frame-lt">
      Lower thirds
    </button>
    <button type="button" class="tab" data-tab="ticker" data-frame="frame-ticker">
      News ticker
    </button>
  </nav>
  <div class="header-spacer"></div>
  <div class="session-pill" id="session-pill">
    Session <code id="session-code"></code>
  </div>
  <button type="button" class="obs-link" id="copy-obs-url" title="Copy the OBS Browser Source URL for the active overlay">Copy OBS URL</button>
</header>

<main id="admin-body">
  <iframe id="frame-lt" class="tab-frame is-active" title="Lower thirds operator panel"></iframe>
  <iframe id="frame-ticker" class="tab-frame" title="News ticker operator panel"></iframe>
</main>

<script>
(function(){
  'use strict';

  /*
   * Operator command-center. Each overlay's operator panel runs in its own
   * iframe so they share the admin chrome but keep their existing standalone
   * lifecycles (each panel manages its own WebSocket connection to OBS).
   *
   * Tab switching toggles iframe visibility; both frames stay mounted so
   * cue lists, sync connections, and focused inputs survive a tab flip.
   *
   * `?session=…` on the admin URL is propagated into every iframe so the
   * admin, the embedded operator, and the OBS overlay all join the same SSN
   * room. With no session, each panel falls back to its per-tool default.
   *
   * To add a new overlay tool: build it as a self-contained
   * <tool>.html (operator UI + ?obs overlay), then add a key to the TABS
   * map below and a matching <button class="tab"> + <iframe> in the markup.
   */

  var params = new URLSearchParams(location.search);
  var session = params.get('session') || params.get('s') || params.get('room') || '';
  var sessionQuery = session ? '?session=' + encodeURIComponent(session) : '';

  var TABS = {
    'lower-thirds': {
      frame: 'frame-lt',
      src: 'lower-thirds.html' + sessionQuery,
      obs: 'lower-thirds.html' + (session ? sessionQuery + '&' : '?') + 'obs'
    },
    'ticker': {
      frame: 'frame-ticker',
      src: 'ticker.html' + sessionQuery,
      obs: 'ticker.html' + (session ? sessionQuery + '&' : '?') + 'obs'
    }
  };

  /* Iframes are mounted on first activation so we don't open a WebSocket
     for a tool the operator never opens this session. */
  function mountFrame(tabName){
    var def = TABS[tabName];
    if (!def) return;
    var f = document.getElementById(def.frame);
    if (!f.getAttribute('src')) f.setAttribute('src', def.src);
  }

  var tabs = document.querySelectorAll('.tab');
  var frames = document.querySelectorAll('.tab-frame');
  var copyBtn = document.getElementById('copy-obs-url');
  var sessionCode = document.getElementById('session-code');
  var sessionPill = document.getElementById('session-pill');
  var activeTab = 'lower-thirds';

  if (session){
    sessionCode.textContent = session;
  } else {
    sessionPill.style.display = 'none';
  }

  function setActive(name){
    if (!TABS[name]) return;
    activeTab = name;
    mountFrame(name);
    var frameId = TABS[name].frame;
    tabs.forEach(function(t){
      t.classList.toggle('is-active', t.getAttribute('data-tab') === name);
    });
    frames.forEach(function(f){
      f.classList.toggle('is-active', f.id === frameId);
    });
  }

  tabs.forEach(function(t){
    t.addEventListener('click', function(){
      setActive(t.getAttribute('data-tab'));
    });
  });

  /* The OBS Browser Source URL for the active tab. */
  copyBtn.addEventListener('click', function(){
    var rel = TABS[activeTab].obs;
    var abs = new URL(rel, location.href).href;
    var done = function(){
      copyBtn.classList.add('is-copied');
      copyBtn.textContent = 'Copied!';
      setTimeout(function(){
        copyBtn.classList.remove('is-copied');
        copyBtn.textContent = 'Copy OBS URL';
      }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(abs).then(done, function(){ window.prompt('OBS Browser Source URL:', abs); });
    } else {
      window.prompt('OBS Browser Source URL:', abs);
    }
  });

  setActive('lower-thirds');
})();
</script>
</body>
</html>
