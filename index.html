<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="Social Stream Ninja - Syntax.fm Theme">
<title>Syntax.fm Chat Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Space Grotesk',system-ui,sans-serif;
  background:#0000;
  overflow:hidden;
  color:#f7f6f2;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}

/* ── CONTAINER ── */
#output{
  position:absolute;
  bottom:30px;
  left:15px;
  right:15px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  transition:transform .5s cubic-bezier(.25,.25,.105,1.2),opacity .5s ease;
}

/* ── MESSAGE CARD (chunky solid shadow; no thin left accent) ── */
/* Stepped 1px box-shadows = connected extrusion (fills rounded-corner gap vs one offset layer). */
.msg{
  position:relative;
  padding:22px 24px 22px 100px;
  width:fit-content;
  max-width:100%;
  background:#141413;
  border:2px solid #454441;
  border-radius:8px;
  box-shadow:
    1px 1px 0 0 #050504,2px 2px 0 0 #050504,3px 3px 0 0 #050504,4px 4px 0 0 #050504,5px 5px 0 0 #050504,
    6px 6px 0 0 #050504,7px 7px 0 0 #050504,8px 8px 0 0 #050504,9px 9px 0 0 #050504,10px 10px 0 0 #050504;
  min-height:80px;
  animation:slideUp .4s cubic-bezier(.33,1,.68,1) both;
  margin-bottom:14px;
}

/* Chunky shadow + frame tint by source */
.msg[data-type="twitch"]{
  border-color:#6b3fd4;
  box-shadow:
    1px 1px 0 0 #4c1fa8,2px 2px 0 0 #4c1fa8,3px 3px 0 0 #4c1fa8,4px 4px 0 0 #4c1fa8,5px 5px 0 0 #4c1fa8,
    6px 6px 0 0 #4c1fa8,7px 7px 0 0 #4c1fa8,8px 8px 0 0 #4c1fa8,9px 9px 0 0 #4c1fa8,10px 10px 0 0 #4c1fa8;
}
.msg[data-type="youtube"],.msg[data-type="youtubeshorts"]{
  border-color:#c43d3c;
  box-shadow:
    1px 1px 0 0 #8f2524,2px 2px 0 0 #8f2524,3px 3px 0 0 #8f2524,4px 4px 0 0 #8f2524,5px 5px 0 0 #8f2524,
    6px 6px 0 0 #8f2524,7px 7px 0 0 #8f2524,8px 8px 0 0 #8f2524,9px 9px 0 0 #8f2524,10px 10px 0 0 #8f2524;
}
.msg[data-type="x"],.msg[data-type="twitter"]{
  border-color:#c9c7c1;
  box-shadow:
    1px 1px 0 0 #8a8883,2px 2px 0 0 #8a8883,3px 3px 0 0 #8a8883,4px 4px 0 0 #8a8883,5px 5px 0 0 #8a8883,
    6px 6px 0 0 #8a8883,7px 7px 0 0 #8a8883,8px 8px 0 0 #8a8883,9px 9px 0 0 #8a8883,10px 10px 0 0 #8a8883;
}
.msg[data-type="kick"]{
  border-color:#3dd816;
  box-shadow:
    1px 1px 0 0 #1f7a0c,2px 2px 0 0 #1f7a0c,3px 3px 0 0 #1f7a0c,4px 4px 0 0 #1f7a0c,5px 5px 0 0 #1f7a0c,
    6px 6px 0 0 #1f7a0c,7px 7px 0 0 #1f7a0c,8px 8px 0 0 #1f7a0c,9px 9px 0 0 #1f7a0c,10px 10px 0 0 #1f7a0c;
}
.msg[data-type="discord"]{
  border-color:#6b77f0;
  box-shadow:
    1px 1px 0 0 #3d46a8,2px 2px 0 0 #3d46a8,3px 3px 0 0 #3d46a8,4px 4px 0 0 #3d46a8,5px 5px 0 0 #3d46a8,
    6px 6px 0 0 #3d46a8,7px 7px 0 0 #3d46a8,8px 8px 0 0 #3d46a8,9px 9px 0 0 #3d46a8,10px 10px 0 0 #3d46a8;
}
.msg[data-type="facebook"]{
  border-color:#2a8ef5;
  box-shadow:
    1px 1px 0 0 #0d5cb8,2px 2px 0 0 #0d5cb8,3px 3px 0 0 #0d5cb8,4px 4px 0 0 #0d5cb8,5px 5px 0 0 #0d5cb8,
    6px 6px 0 0 #0d5cb8,7px 7px 0 0 #0d5cb8,8px 8px 0 0 #0d5cb8,9px 9px 0 0 #0d5cb8,10px 10px 0 0 #0d5cb8;
}
.msg[data-type="tiktok"]{
  border-color:#ff3d6d;
  box-shadow:
    1px 1px 0 0 #b30d35,2px 2px 0 0 #b30d35,3px 3px 0 0 #b30d35,4px 4px 0 0 #b30d35,5px 5px 0 0 #b30d35,
    6px 6px 0 0 #b30d35,7px 7px 0 0 #b30d35,8px 8px 0 0 #b30d35,9px 9px 0 0 #b30d35,10px 10px 0 0 #b30d35;
}

/* ── AVATAR ── */
.avatar-wrap{
  position:absolute;
  top:0;left:0;
  width:80px;height:80px;
  background:#1e1e1d;
  border:2px solid #4a4946;
  border-radius:50%;
  padding:2px;
  overflow:hidden;
  z-index:3;
}
.avatar-wrap img{
  width:100%;height:100%;
  object-fit:cover;
  border-radius:50%;
  display:block;
}

/* ── NAME TAG ── */
.name-tag{
  position:absolute;
  top:-14px;left:70px;
  max-width:calc(100% - 85px);
  background:#1a1918;
  border:2px solid #5c5a55;
  border-radius:6px;
  padding:6px 12px;
  font-family:'Space Mono',monospace;
  font-weight:700;
  font-size:14px;
  color:#ffd54a;
  text-transform:uppercase;
  letter-spacing:.04em;
  white-space:nowrap;
  z-index:4;
  display:flex;
  align-items:center;
  gap:6px;
  box-shadow:1px 1px 0 0 #0a0a09,2px 2px 0 0 #0a0a09,3px 3px 0 0 #0a0a09,4px 4px 0 0 #0a0a09;
}

/* Source-tinted name colors (higher contrast fg/bg) */
.msg[data-type="twitch"] .name-tag{color:#e4d4ff;border-color:#8b6fe6;background:#120a24;box-shadow:1px 1px 0 0 #2d1566,2px 2px 0 0 #2d1566,3px 3px 0 0 #2d1566,4px 4px 0 0 #2d1566}
.msg[data-type="youtube"] .name-tag,.msg[data-type="youtubeshorts"] .name-tag{color:#ffc9c9;border-color:#a84848;background:#1a0808;box-shadow:1px 1px 0 0 #5c1818,2px 2px 0 0 #5c1818,3px 3px 0 0 #5c1818,4px 4px 0 0 #5c1818}
.msg[data-type="x"] .name-tag,.msg[data-type="twitter"] .name-tag{color:#faf9f7;border-color:#8a8884;background:#222221;box-shadow:1px 1px 0 0 #3d3c3a,2px 2px 0 0 #3d3c3a,3px 3px 0 0 #3d3c3a,4px 4px 0 0 #3d3c3a}
.msg[data-type="kick"] .name-tag{color:#b8ff9a;border-color:#2d8c18;background:#071a05;box-shadow:1px 1px 0 0 #0f4d08,2px 2px 0 0 #0f4d08,3px 3px 0 0 #0f4d08,4px 4px 0 0 #0f4d08}
.msg[data-type="discord"] .name-tag{color:#d2d8ff;border-color:#6f7ae8;background:#0c0e22;box-shadow:1px 1px 0 0 #232a66,2px 2px 0 0 #232a66,3px 3px 0 0 #232a66,4px 4px 0 0 #232a66}
.msg[data-type="facebook"] .name-tag{color:#b8dcff;border-color:#3d8eef;background:#061428;box-shadow:1px 1px 0 0 #0a3a72,2px 2px 0 0 #0a3a72,3px 3px 0 0 #0a3a72,4px 4px 0 0 #0a3a72}
.msg[data-type="tiktok"] .name-tag{color:#ffb3c9;border-color:#e84870;background:#1a050c;box-shadow:1px 1px 0 0 #6a1028,2px 2px 0 0 #6a1028,3px 3px 0 0 #6a1028,4px 4px 0 0 #6a1028}

/* Source-tinted avatars */
.msg[data-type="twitch"] .avatar-wrap{border-color:#8b6fe6}
.msg[data-type="youtube"] .avatar-wrap,.msg[data-type="youtubeshorts"] .avatar-wrap{border-color:#c45a5a}
.msg[data-type="kick"] .avatar-wrap{border-color:#3dd816}
.msg[data-type="discord"] .avatar-wrap{border-color:#6f7ae8}
.msg[data-type="facebook"] .avatar-wrap{border-color:#3d8eef}
.msg[data-type="tiktok"] .avatar-wrap{border-color:#ff3d6d}
.msg[data-type="x"] .avatar-wrap,.msg[data-type="twitter"] .avatar-wrap{border-color:#a8a6a1}

.name-text{display:inline-block;vertical-align:middle}
.badges-inline{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-left:4px;
  vertical-align:middle;
  flex-shrink:0;
  max-height:22px;
}
.chat-badge{
  height:18px;
  width:auto;
  max-height:18px;
  vertical-align:middle;
  display:inline-block;
  object-fit:contain;
}
/* Raw SVG badges ship huge width/height attrs; constrain like upstream themes */
.badge-svg-wrap{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  height:18px;
  max-width:96px;
  line-height:0;
}
.badge-svg-wrap svg{
  height:18px;
  width:auto;
  max-width:100%;
  display:block;
}
.badges-inline>svg{
  height:18px;
  width:auto;
  max-height:18px;
  max-width:96px;
  display:block;
}

.source-badge{
  font-family:'Space Mono',monospace;
  font-size:11px;
  font-weight:600;
  color:#c9c6bc;
  letter-spacing:.04em;
  opacity:1;
}

/* ── MESSAGE TEXT ── */
.msg-text{
  font-size:28px;
  font-weight:500;
  line-height:1.45;
  letter-spacing:-.01em;
  color:#f7f6f2;
  word-break:break-word;
}
.msg-text{font-style:normal}
.msg-text :is(em,i,cite,var,dfn){font-style:normal}
.msg-text img,.msg-text svg{
  max-height:1.35em;
  height:auto;
  width:auto;
  max-width:200px;
  vertical-align:middle;
  object-fit:contain;
  margin:0 2px;
  display:inline-block;
}
.msg-text img.emote,.msg-text svg.emote,
.msg-text img[class*=emote],.msg-text svg[class*=emote]{
  max-height:1.5em;
  max-width:1.5em;
}
.msg-text a{color:#5eead4;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* ── DONATION ── */
.dono-badge{
  display:inline-block;
  background:#ffd54a;
  color:#0a0a09;
  font-family:'Space Mono',monospace;
  font-weight:700;
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:.06em;
  padding:6px 12px;
  border-radius:6px;
  margin-top:10px;
  border:2px solid #0a0a09;
  box-shadow:1px 1px 0 0 #0a0a09,2px 2px 0 0 #0a0a09,3px 3px 0 0 #0a0a09,4px 4px 0 0 #0a0a09;
}

.dono-badge--membership{
  background:#1a1918;
  color:#ffd54a;
  border:2px solid #ffd54a;
  box-shadow:1px 1px 0 0 #0a0a09,2px 2px 0 0 #0a0a09,3px 3px 0 0 #0a0a09,4px 4px 0 0 #0a0a09;
}

/* ── CONTENT IMAGE ── */
.content-img{
  max-width:40%;
  max-height:200px;
  border-radius:8px;
  border:2px solid #454441;
  margin-top:10px;
  display:block;
  box-shadow:
    1px 1px 0 0 #0a0a09,2px 2px 0 0 #0a0a09,3px 3px 0 0 #0a0a09,4px 4px 0 0 #0a0a09,5px 5px 0 0 #0a0a09,
    6px 6px 0 0 #0a0a09;
}

/* ── ANIMATIONS ── */
@keyframes slideUp{
  0%{opacity:0;transform:translateY(16px)}
  100%{opacity:1;transform:translateY(0)}
}
.msg-exit{
  opacity:0;
  transform:translateY(40px);
  transition:all .5s ease-in-out;
}

/* ── EMPTY STATE ── */
#output:empty{display:none}
</style>
</head>
<body>
<div id="output"></div>
<script>
(function(){
  'use strict';

  /* ── CONFIG ── */
  var featuredMode = true; /* true = only show clicked/featured messages; false = show all */
  var maxStacked = 1; /* set >1 for stacked mode */

  /* ── URL PARAMS ── */
  var params = new URLSearchParams(location.search);
  var session = params.get('session') || params.get('s') || params.get('id') || params.get('room') || params.get('roomid') || 'test';
  var iframePassword = params.get('password') || params.get('pass') || params.get('pw') || 'false';
  if (params.has('all')) featuredMode = false;
  if (params.has('stacked') || params.has('stack')) maxStacked = parseInt(params.get('stacked') || params.get('stack')) || 5;
  var showtime = parseInt(params.get('showtime')) || 0;

  var sourceLabels = {
    twitch:'#twitch',youtube:'#youtube',youtubeshorts:'#shorts',
    kick:'#kick',discord:'#discord',tiktok:'#tiktok',
    facebook:'#facebook',instagram:'#instagram',
    x:'#x',twitter:'#twitter'
  };

  var output = document.getElementById('output');

  function esc(s){
    if(!s)return'';
    var d=document.createElement('div');
    d.textContent=s;
    return d.innerHTML;
  }

  function safeCssColor(c){
    if(!c||typeof c!=='string')return'';
    var t=c.trim();
    if(t.length>120)return'';
    if(/[<>'"`;\\]|url\s*\(/i.test(t))return'';
    return t;
  }

  function escUrl(s){
    if(!s||typeof s!=='string')return'';
    try{
      var abs=s.indexOf('//')===0?(location.protocol||'https:')+s:s;
      var u=new URL(abs, location.href);
      if(u.protocol!=='http:'&&u.protocol!=='https:')return'';
      return u.href.replace(/"/g,'&quot;');
    }catch(e){return''}
  }

  function renderBadgesHtml(chatbadges){
    if(!chatbadges||!Array.isArray(chatbadges))return'';
    var parts=[];
    chatbadges.forEach(function(badge){
      if(typeof badge==='string'&&badge){
        var u=escUrl(badge);
        if(u)parts.push('<img class="chat-badge" src="'+u+'" alt="">');
      }else if(badge&&typeof badge==='object'){
        if(badge.type==='img'&&badge.src){
          var su=escUrl(badge.src);
          if(su)parts.push('<img class="chat-badge" src="'+su+'" alt="">');
        }else if(badge.type==='svg'&&badge.html){
          parts.push('<span class="badge-svg-wrap">'+badge.html+'</span>');
        }else if(badge.src){
          var s2=escUrl(badge.src);
          if(s2)parts.push('<img class="chat-badge" src="'+s2+'" alt="">');
        }
      }
    });
    if(!parts.length)return'';
    return '<span class="badges-inline">'+parts.join('')+'</span>';
  }

  function renderMessage(data){
    if(!data)return;
    var donationVal = data.hasDonation || data.donation;
    if(!data.chatmessage && !data.chatname && !data.contentimg && !donationVal && !data.membership) return;

    var type = (data.type||'').toLowerCase();
    var name = data.chatname||'';
    var msg = data.chatmessage||'';
    var img = data.chatimg||'';
    var srcLabel = sourceLabels[type]||'';

    /* Build name display: _NAME() #source */
    var nameClean = esc(name).replace(/\s+/g,'_').toUpperCase();
    var nameDisplay = nameClean ? '_'+nameClean+'()' : '';
    var nc = safeCssColor(data.nameColor);
    var nameColorStyle = nc ? ' style="color:'+nc+'"' : '';
    var tc = safeCssColor(data.textColor);
    var badgesHtml = renderBadgesHtml(data.chatbadges);

    /* Avatar */
    var avatarUrl = img || 'https://socialstream.ninja/sources/images/unknown.png';

    /* Donation */
    var donoHtml = '';
    if(donationVal){
      donoHtml = '<div class="dono-badge">'+(data.title?esc(data.title)+': ':'')+esc(String(donationVal))+'</div>';
    }

    /* Content image */
    var contentHtml = '';
    if(data.contentimg){
      contentHtml = '<img class="content-img" src="'+data.contentimg+'" onerror="this.style.display=\'none\'">';
    }

    /* Membership */
    if(data.membership && !donoHtml){
      donoHtml = '<div class="dono-badge dono-badge--membership">'+esc(data.membership)+'</div>';
    }

    var el = document.createElement('div');
    el.className = 'msg';
    el.setAttribute('data-type', type);

    el.innerHTML =
      '<div class="avatar-wrap"><img src="'+avatarUrl+'" onerror="this.src=\'https://socialstream.ninja/sources/images/unknown.png\'"></div>'+
      (nameDisplay ? '<div class="name-tag"><span class="name-text"'+nameColorStyle+'>'+nameDisplay+'</span>'+badgesHtml+(srcLabel?'<span class="source-badge">'+srcLabel+'</span>':'')+'</div>' : (badgesHtml||srcLabel ? '<div class="name-tag">'+badgesHtml+(srcLabel?'<span class="source-badge">'+srcLabel+'</span>':'')+'</div>' : ''))+
      '<div class="msg-text"'+(tc?' style="color:'+tc+'"':'')+'>'+msg+'</div>'+
      donoHtml+
      contentHtml;

    /* Stacking or single */
    if(maxStacked <= 1){
      output.innerHTML = '';
      output.appendChild(el);
    } else {
      output.appendChild(el);
      var msgs = output.querySelectorAll('.msg');
      while(msgs.length > maxStacked){
        var old = msgs[0];
        old.classList.add('msg-exit');
        setTimeout(function(e){if(e.parentNode)e.parentNode.removeChild(e)},500,old);
        msgs = output.querySelectorAll('.msg:not(.msg-exit)');
      }
    }

    /* Auto-hide */
    if(showtime){
      setTimeout(function(){
        el.classList.add('msg-exit');
        setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},500);
      }, showtime);
    }
  }

  function clearOutput(){
    var msgs = output.querySelectorAll('.msg');
    msgs.forEach(function(m){
      m.classList.add('msg-exit');
      setTimeout(function(){if(m.parentNode)m.parentNode.removeChild(m)},500);
    });
  }

  function processData(raw){
    var data;
    try{
      data = typeof raw === 'string' ? JSON.parse(raw) : raw;
    }catch(e){return}

    if(data && 'overlayNinja' in data) data = data.overlayNinja;

    if(data && 'content' in data){
      if(data.content){
        renderMessage(typeof data.content==='string'?JSON.parse(data.content):data.content);
      } else {
        clearOutput();
      }
      return;
    }
    if(data && data.action==='content' && 'value' in data){
      if(data.value){
        var v = typeof data.value==='string'?JSON.parse(data.value):data.value;
        if(v && (v.chatmessage || v.chatname || v.contentimg || v.hasDonation || v.donation || v.membership)) renderMessage(v);
      } else {
        clearOutput();
      }
      return;
    }
    if(data && 'chatmessage' in data){
      renderMessage(data);
      return;
    }
    if(data && 'contents' in data){
      if(data.contents) renderMessage(data.contents);
      else clearOutput();
    }
  }

  /* ── WEBSOCKET CONNECTION ── */
  var wsUrl = params.has('localserver') ? 'ws://127.0.0.1:3000' : 'wss://io.socialstream.ninja';
  var inChannel = featuredMode ? 2 : 1;
  var outChannel = 3;
  var conCon = 1;
  var reconnectTimer = null;

  function connect(){
    if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null}
    var ws = new WebSocket(wsUrl);

    ws.onopen = function(){
      conCon = 1;
      ws.send(JSON.stringify({join:session, in:inChannel, out:outChannel}));
    };

    ws.onmessage = function(e){
      if(!e.data) return;
      try{
        var d = typeof e.data==='string' ? JSON.parse(e.data) : e.data;
        processData(d);
      }catch(err){
        console.error('Parse error:',err);
      }
    };

    ws.onclose = function(){
      reconnectTimer = setTimeout(function(){
        conCon++;
        connect();
      }, 100*conCon);
    };

    ws.onerror = function(){ws.close()};
  }

  /* ── IFRAME FALLBACK (P2P via VDO.Ninja) ── */
  function connectIframe(){
    var iframe = document.createElement('iframe');
    iframe.src = 'https://vdo.socialstream.ninja/?ln&password='+encodeURIComponent(iframePassword)+'&salt=vdo.ninja&label=overlay&exclude='+encodeURIComponent(session)+'&scene&novideo&noaudio&cleanoutput&room='+encodeURIComponent(session);
    iframe.style.cssText = 'width:0;height:0;position:fixed;left:-100px;top:-100px';
    iframe.allow = 'microphone';
    document.body.appendChild(iframe);

    window.addEventListener('message', function(e){
      if(e.source !== iframe.contentWindow) return;
      if(e.data && e.data.dataReceived && e.data.dataReceived.overlayNinja){
        var d = e.data.dataReceived.overlayNinja;
        if(d && !('response' in d)){
          processData({contents:d});
        }
      }
    });
  }

  /* ── INIT ── */
  if(params.has('server') || params.has('server2') || params.has('server3')){
    wsUrl = params.get('server') || params.get('server2') || params.get('server3') || wsUrl;
    connect();
  } else {
    /* Use BOTH methods for maximum compatibility */
    connect();
    connectIframe();
  }

})();
</script>
</body>
</html>
