<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syntax — Lower thirds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Space Grotesk',system-ui,sans-serif;
  min-height:100vh;
  background:#0e0e0d;
  color:#f7f6f2;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

body.obs-mode{background:#0000}
body.obs-mode #controls{display:none}

/* ── OPERATOR PANEL ── */
#controls{
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  padding:14px 16px 18px;
  background:linear-gradient(180deg,rgba(14,14,13,.97) 0%,rgba(14,14,13,.88) 70%,transparent 100%);
  border-bottom:1px solid #2a2a28;
}
.controls-inner{
  max-width:920px;
  margin:0 auto;
  display:flex;
  flex-wrap:wrap;
  gap:12px 16px;
  align-items:flex-end;
}
.controls-title{
  width:100%;
  font-family:'Space Mono',monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#8a8883;
  margin-bottom:2px;
  display:flex;
  align-items:center;
  gap:10px;
}
.sync-status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-family:'Space Mono',monospace;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#6a6965;
}
.sync-status::before{
  content:'';
  width:8px;
  height:8px;
  border-radius:50%;
  background:#5c5a55;
  box-shadow:0 0 0 2px rgba(92,90,85,.18);
  transition:background .15s ease,box-shadow .15s ease;
}
.sync-status[data-state="connected"]{color:#7be09a}
.sync-status[data-state="connected"]::before{background:#3dd816;box-shadow:0 0 0 2px rgba(61,216,22,.22)}
.sync-status[data-state="connecting"],
.sync-status[data-state="reconnecting"]{color:#ffd54a}
.sync-status[data-state="connecting"]::before,
.sync-status[data-state="reconnecting"]::before{background:#ffd54a;box-shadow:0 0 0 2px rgba(255,213,74,.22);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.45}
}
.person-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px 10px;
  align-items:center;
  flex:1 1 260px;
  min-width:220px;
  padding:10px 12px;
  background:#141413;
  border:2px solid #353431;
  border-radius:8px;
  box-shadow:1px 1px 0 0 #050504,2px 2px 0 0 #050504,3px 3px 0 0 #050504;
}
.person-row[data-person="cj"]{border-color:#b8894a}
.person-row[data-person="scott"]{border-color:#4a9e8e}
.person-row[data-person="wes"]{border-color:#8b7ec9}
.person-row[data-person="randy"]{border-color:#e87b5a}

.person-row label{
  font-family:'Space Mono',monospace;
  font-size:12px;
  font-weight:700;
  color:#ffd54a;
  min-width:5rem;
}
.person-row[data-person="scott"] label{color:#9ee9dc}
.person-row[data-person="wes"] label{color:#dcd4ff}
.person-row[data-person="randy"] label{color:#ffc9b5}

.person-row input[type="text"]{
  flex:1 1 140px;
  min-width:120px;
  padding:8px 10px;
  font-family:'Space Grotesk',sans-serif;
  font-size:14px;
  background:#1a1918;
  border:2px solid #454441;
  border-radius:6px;
  color:#f7f6f2;
}
.person-row input[type="text"]::placeholder{color:#6a6965}

.btn-show{
  font-family:'Space Mono',monospace;
  font-weight:700;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.06em;
  padding:8px 14px;
  border-radius:6px;
  border:2px solid #0a0a09;
  cursor:pointer;
  background:#ffd54a;
  color:#0a0a09;
  box-shadow:1px 1px 0 0 #0a0a09,2px 2px 0 0 #0a0a09,3px 3px 0 0 #0a0a09;
  transition:transform .08s ease,box-shadow .08s ease;
}
.btn-show:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 0 #0a0a09,2px 2px 0 0 #0a0a09}
.btn-show:active{transform:translate(2px,2px);box-shadow:1px 1px 0 0 #0a0a09}

.person-row[data-person="scott"] .btn-show{background:#5eead4;color:#0a0a09}
.person-row[data-person="wes"] .btn-show{background:#c4b5fd;color:#1a1028}
.person-row[data-person="randy"] .btn-show{background:#ff9b7a;color:#28100a}

/* When a person's lower third is live, their button shifts to a neutral
   "Hide" treatment regardless of the person tint. */
.btn-show.is-hide,
.person-row[data-person="cj"] .btn-show.is-hide,
.person-row[data-person="scott"] .btn-show.is-hide,
.person-row[data-person="wes"] .btn-show.is-hide,
.person-row[data-person="randy"] .btn-show.is-hide{
  background:#1a1918;
  color:#c9c6bc;
  border-color:#5c5a55;
}
.btn-show.is-hide:hover{
  background:#221f1c;
  color:#f7f6f2;
}
.hint{
  font-size:12px;
  color:#6a6965;
  width:100%;
}
.hint kbd{
  font-family:'Space Mono',monospace;
  font-size:11px;
  padding:2px 6px;
  border-radius:4px;
  border:1px solid #454441;
  background:#1a1918;
}

/* ── STAGE (overlay safe zone) ── */
#stage-wrap{
  position:fixed;
  inset:0;
  pointer-events:none;
  display:flex;
  align-items:flex-end;
  justify-content:flex-start;
  padding:24px 24px 36px 24px;
}
body:not(.obs-mode) #stage-wrap{padding-top:140px}

#stage{
  pointer-events:none;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

/* ── LOWER THIRD CARD (avatar bleeds out the top-left of the card) ── */
.lt-root{
  position:relative;
  display:inline-block;
  max-width:min(92vw,560px);
  /* Padding reserves room for the avatar to bleed out the top-left without
     clipping the drop-shadow under it. */
  padding:64px 0 6px 8px;
  animation:ltIn .42s cubic-bezier(.33,1,.68,1) both;
}
.lt-root.lt-exit{
  animation:ltOut .45s cubic-bezier(.55,0,.68,.06) forwards;
}

/* The host SVGs in assets/lower-thirds/ are all authored to a 360×360
   canvas with the face placed in the same relative position, so one set
   of width + offset values works for every person. */
.lt-avatar{
  position:absolute;
  z-index:2;
  top:-30px;
  left:-30px;
  width:clamp(180px,26vw,230px);
  pointer-events:none;
  filter:drop-shadow(3px 4px 0 rgba(5,5,4,.65)) drop-shadow(0 1px 0 rgba(247,246,242,.06));
}
.lt-avatar img,.lt-avatar object{
  width:100%;
  height:auto;
  display:block;
}

.lt-card{
  position:relative;
  z-index:1;
  min-width:360px;
  /* Left padding tracks the avatar so the name clears the photo. */
  padding:14px 20px 14px clamp(128px,19vw,160px);
  background:#141413;
  border:2px solid #454441;
  border-radius:8px;
  box-shadow:
    1px 1px 0 0 #050504,2px 2px 0 0 #050504,3px 3px 0 0 #050504,4px 4px 0 0 #050504,5px 5px 0 0 #050504,
    6px 6px 0 0 #050504,7px 7px 0 0 #050504,8px 8px 0 0 #050504,9px 9px 0 0 #050504,10px 10px 0 0 #050504;
}

.lt-root[data-person="cj"] .lt-card{border-color:#d4a574}
.lt-root[data-person="cj"] .lt-card{
  box-shadow:
    1px 1px 0 0 #6b4f32,2px 2px 0 0 #6b4f32,3px 3px 0 0 #6b4f32,4px 4px 0 0 #6b4f32,5px 5px 0 0 #6b4f32,
    6px 6px 0 0 #6b4f32,7px 7px 0 0 #6b4f32,8px 8px 0 0 #6b4f32,9px 9px 0 0 #6b4f32,10px 10px 0 0 #6b4f32;
}
.lt-root[data-person="scott"] .lt-card{border-color:#4a9e8e}
.lt-root[data-person="scott"] .lt-card{
  box-shadow:
    1px 1px 0 0 #25574d,2px 2px 0 0 #25574d,3px 3px 0 0 #25574d,4px 4px 0 0 #25574d,5px 5px 0 0 #25574d,
    6px 6px 0 0 #25574d,7px 7px 0 0 #25574d,8px 8px 0 0 #25574d,9px 9px 0 0 #25574d,10px 10px 0 0 #25574d;
}
.lt-root[data-person="wes"] .lt-card{border-color:#8b7ec9}
.lt-root[data-person="wes"] .lt-card{
  box-shadow:
    1px 1px 0 0 #4a3d7a,2px 2px 0 0 #4a3d7a,3px 3px 0 0 #4a3d7a,4px 4px 0 0 #4a3d7a,5px 5px 0 0 #4a3d7a,
    6px 6px 0 0 #4a3d7a,7px 7px 0 0 #4a3d7a,8px 8px 0 0 #4a3d7a,9px 9px 0 0 #4a3d7a,10px 10px 0 0 #4a3d7a;
}
.lt-root[data-person="randy"] .lt-card{border-color:#e87b5a}
.lt-root[data-person="randy"] .lt-card{
  box-shadow:
    1px 1px 0 0 #7a2f1a,2px 2px 0 0 #7a2f1a,3px 3px 0 0 #7a2f1a,4px 4px 0 0 #7a2f1a,5px 5px 0 0 #7a2f1a,
    6px 6px 0 0 #7a2f1a,7px 7px 0 0 #7a2f1a,8px 8px 0 0 #7a2f1a,9px 9px 0 0 #7a2f1a,10px 10px 0 0 #7a2f1a;
}

.lt-display-name{
  font-size:clamp(22px,4.2vw,32px);
  font-weight:700;
  line-height:1.1;
  letter-spacing:-.02em;
  color:#f7f6f2;
  margin-bottom:4px;
}

.lt-byline{
  font-size:clamp(15px,2.6vw,20px);
  font-weight:500;
  line-height:1.4;
  color:#c9c6bc;
  letter-spacing:-.01em;
}

.lt-byline:empty::before{
  content:'—';
  opacity:.35;
}

@keyframes ltIn{
  0%{opacity:0;transform:translateY(18px)}
  100%{opacity:1;transform:translateY(0)}
}

@keyframes ltOut{
  0%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(28px)}
}

#stage:empty{display:none}
</style>
</head>
<body>
<div id="controls" aria-label="Lower third controls">
  <div class="controls-inner">
    <div class="controls-title">
      <span>Lower thirds — Syntax style</span>
      <span class="sync-status" id="sync-status" data-state="connecting" title="Connecting…">Connecting</span>
    </div>
    <div class="person-row" data-person="cj">
      <label for="byline-cj">CJ</label>
      <input type="text" id="byline-cj" placeholder="Coding in the garden" autocomplete="off">
      <button type="button" class="btn-show" data-toggle="cj">Show</button>
    </div>
    <div class="person-row" data-person="scott">
      <label for="byline-scott">Scott</label>
      <input type="text" id="byline-scott" placeholder="Spins on head" autocomplete="off">
      <button type="button" class="btn-show" data-toggle="scott">Show</button>
    </div>
    <div class="person-row" data-person="wes">
      <label for="byline-wes">Wes</label>
      <input type="text" id="byline-wes" placeholder="Hot tips incoming" autocomplete="off">
      <button type="button" class="btn-show" data-toggle="wes">Show</button>
    </div>
    <div class="person-row" data-person="randy">
      <label for="byline-randy">Randy</label>
      <input type="text" id="byline-randy" placeholder="Behind the scenes" autocomplete="off">
      <button type="button" class="btn-show" data-toggle="randy">Show</button>
    </div>
    <p class="hint">OBS: add the same page with <kbd>?obs</kbd> for a transparent overlay (no buttons). Triggers from this page sync over WebSocket to every connected overlay. Auto-hides after 10s. Use <kbd>?session=…</kbd> to scope to a specific room.</p>
  </div>
</div>

<div id="stage-wrap">
  <div id="stage" aria-live="polite"></div>
</div>

<script>
(function(){
  'use strict';

  var PEOPLE = {
    cj: {
      name: 'CJ',
      avatar: 'assets/lower-thirds/CJ.svg'
    },
    scott: {
      name: 'Scott Tolinski',
      avatar: 'assets/lower-thirds/Scott.svg'
    },
    wes: {
      name: 'Wes Bos',
      avatar: 'assets/lower-thirds/Wes.svg'
    },
    randy: {
      name: 'Randy',
      avatar: 'assets/lower-thirds/Randy.svg'
    }
  };

  var params = new URLSearchParams(location.search);
  if (params.has('obs') || params.has('overlay')) {
    document.body.classList.add('obs-mode');
  }

  var stage = document.getElementById('stage');
  var EXIT_MS = 480;
  var AUTO_HIDE_MS = 10000;
  var currentEl = null;
  var currentKey = null;
  var currentOwned = false;  /* true if this tab initiated the current show */
  var exitTimer = null;
  var autoHideTimer = null;

  /* ── SYNC ──
     The operator panel and the OBS overlay are the same page in different
     modes. They reach each other through the Social Stream Ninja relay,
     joined to a private session room on a dedicated peer channel
     (in == out == 7). Payloads are wrapped in `overlayNinja.syntaxLT` so
     featured-comment.html (chat overlay) ignores them cleanly.

     SSN's default channel layout (in:1|2, out:3) is asymmetric and won't
     relay between two overlay-style clients, so we use channel 7 instead. */
  var SYNC_SESSION = params.get('session') || params.get('s') || params.get('room') || 'syntax-lower-thirds-default';
  var SYNC_URL = params.get('server') || (params.has('localserver') ? 'ws://127.0.0.1:3000' : 'wss://io.socialstream.ninja');
  /* Per-tab id stamped on every outgoing message; the relay echoes our own
     broadcasts back, so we filter them out by id on receive. */
  var TAB_ID = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  var ws = null;
  var wsReady = false;
  var conCon = 1;
  var reconnectTimer = null;
  var statusEl = document.getElementById('sync-status');

  function setSyncStatus(state, label){
    if (!statusEl) return;
    statusEl.setAttribute('data-state', state);
    statusEl.textContent = label || state.charAt(0).toUpperCase() + state.slice(1);
    statusEl.title = label || state;
  }

  function scheduleReconnect(){
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(function(){
      reconnectTimer = null;
      conCon = Math.min(conCon + 1, 30);
      connectSync();
    }, Math.min(150 * conCon, 5000));
  }

  function connectSync(){
    if (reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
    setSyncStatus('connecting', 'Connecting');
    try {
      ws = new WebSocket(SYNC_URL);
    } catch(e){
      scheduleReconnect();
      return;
    }
    ws.onopen = function(){
      conCon = 1;
      wsReady = true;
      try { ws.send(JSON.stringify({ join: SYNC_SESSION, in: 7, out: 7 })); } catch(e){}
      setSyncStatus('connected', 'Live');
    };
    ws.onmessage = function(e){
      if (!e.data) return;
      try {
        var d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
        handleSyncMessage(d);
      } catch(err){}
    };
    ws.onclose = function(){
      wsReady = false;
      setSyncStatus('reconnecting', 'Reconnecting');
      scheduleReconnect();
    };
    ws.onerror = function(){
      try { ws.close(); } catch(e){}
    };
  }

  function broadcast(payload){
    if (!wsReady || !ws) return;
    try {
      payload._tab = TAB_ID;
      ws.send(JSON.stringify({ overlayNinja: { syntaxLT: payload } }));
    } catch(e){}
  }

  function handleSyncMessage(d){
    if (!d || typeof d !== 'object') return;
    if ('overlayNinja' in d) d = d.overlayNinja;
    if (!d || typeof d !== 'object' || !d.syntaxLT) return;
    var msg = d.syntaxLT;
    if (!msg || typeof msg !== 'object') return;
    if (msg._tab === TAB_ID) return;

    if (msg.action === 'show' && msg.person && PEOPLE[msg.person]){
      if (typeof msg.byline === 'string'){
        var inp = document.getElementById('byline-' + msg.person);
        if (inp) inp.value = msg.byline;
      }
      showLowerThird(msg.person, { silent: true, byline: typeof msg.byline === 'string' ? msg.byline : undefined });
    } else if (msg.action === 'hide'){
      hideLowerThird(undefined, false, { silent: true });
    }
  }

  var toggleButtons = {};
  document.querySelectorAll('.btn-show[data-toggle]').forEach(function(btn){
    toggleButtons[btn.getAttribute('data-toggle')] = btn;
  });

  function esc(s){
    if (s == null || s === '') return '';
    var d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
  }

  function getByline(key){
    var inp = document.getElementById('byline-' + key);
    return inp ? inp.value.trim() : '';
  }

  function clearAutoHide(){
    if (autoHideTimer) {
      clearTimeout(autoHideTimer);
      autoHideTimer = null;
    }
  }

  function startAutoHide(){
    clearAutoHide();
    autoHideTimer = setTimeout(function(){
      autoHideTimer = null;
      /* Only the originating tab broadcasts the auto-hide; receivers run
         their own timers silently to avoid N× duplicate hide events. */
      if (currentOwned) broadcast({ action: 'hide' });
      hideLowerThird();
    }, AUTO_HIDE_MS);
  }

  function syncButtons(){
    Object.keys(toggleButtons).forEach(function(key){
      var btn = toggleButtons[key];
      var active = key === currentKey;
      btn.classList.toggle('is-hide', active);
      btn.textContent = active ? 'Hide' : 'Show';
    });
  }

  function hideLowerThird(then, immediate){
    clearAutoHide();
    if (exitTimer) {
      clearTimeout(exitTimer);
      exitTimer = null;
    }
    if (!currentEl || !currentEl.parentNode) {
      currentEl = null;
      currentKey = null;
      syncButtons();
      if (typeof then === 'function') then();
      return;
    }
    var el = currentEl;
    currentKey = null;
    syncButtons();
    if (immediate) {
      if (el.parentNode) el.parentNode.removeChild(el);
      currentEl = null;
      if (typeof then === 'function') then();
      return;
    }
    if (el.classList.contains('lt-exit')) return;
    el.classList.add('lt-exit');
    exitTimer = setTimeout(function(){
      exitTimer = null;
      if (el.parentNode) el.parentNode.removeChild(el);
      if (currentEl === el) currentEl = null;
      if (typeof then === 'function') then();
    }, EXIT_MS);
  }

  function showLowerThird(key, opts){
    opts = opts || {};
    var p = PEOPLE[key];
    if (!p) return;

    var byline = (typeof opts.byline === 'string') ? opts.byline : getByline(key);
    var nextHtml =
      '<div class="lt-root" data-person="' + esc(key) + '">' +
        '<div class="lt-avatar"><img src="' + esc(p.avatar) + '" alt=""></div>' +
        '<div class="lt-card">' +
          '<div class="lt-display-name">' + esc(p.name) + '</div>' +
          '<div class="lt-byline">' + esc(byline) + '</div>' +
        '</div>' +
      '</div>';

    var replace = function(){
      stage.innerHTML = nextHtml;
      currentEl = stage.querySelector('.lt-root');
      currentKey = key;
      currentOwned = !opts.silent;
      syncButtons();
      startAutoHide();
    };

    if (currentEl && currentEl.parentNode) {
      hideLowerThird(replace, true, { silent: true });
    } else {
      replace();
    }

    if (!opts.silent) broadcast({ action: 'show', person: key, byline: byline });
  }

  function togglePerson(key){
    if (currentKey === key) {
      broadcast({ action: 'hide' });
      hideLowerThird();
    } else {
      showLowerThird(key);
    }
  }

  Object.keys(toggleButtons).forEach(function(key){
    toggleButtons[key].addEventListener('click', function(){
      togglePerson(key);
    });
  });

  connectSync();
})();
</script>
</body>
</html>
