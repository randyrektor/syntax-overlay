<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syntax — News ticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Space Grotesk',system-ui,sans-serif;
  min-height:100vh;
  background:#0e0e0d;
  color:#f7f6f2;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

body.obs-mode{background:#0000}
body.obs-mode #controls{display:none}

/* ── OPERATOR PANEL ── */
#controls{
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  padding:14px 16px 18px;
  background:linear-gradient(180deg,rgba(14,14,13,.97) 0%,rgba(14,14,13,.88) 70%,transparent 100%);
  border-bottom:1px solid #2a2a28;
  max-height:70vh;
  overflow-y:auto;
}
.controls-inner{
  max-width:920px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.controls-title{
  font-family:'Space Mono',monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#8a8883;
  display:flex;
  align-items:center;
  gap:10px;
}
.sync-status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-family:'Space Mono',monospace;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#6a6965;
}
.sync-status::before{
  content:'';
  width:8px;
  height:8px;
  border-radius:50%;
  background:#5c5a55;
  box-shadow:0 0 0 2px rgba(92,90,85,.18);
  transition:background .15s ease,box-shadow .15s ease;
}
.sync-status[data-state="connected"]{color:#7be09a}
.sync-status[data-state="connected"]::before{background:#3dd816;box-shadow:0 0 0 2px rgba(61,216,22,.22)}
.sync-status[data-state="connecting"],
.sync-status[data-state="reconnecting"]{color:#ffd54a}
.sync-status[data-state="connecting"]::before,
.sync-status[data-state="reconnecting"]::before{background:#ffd54a;box-shadow:0 0 0 2px rgba(255,213,74,.22);animation:syncPulse 1s ease-in-out infinite}
@keyframes syncPulse{
  0%,100%{opacity:1}
  50%{opacity:.45}
}

/* ── ADD ROW ── */
.ticker-add{
  display:flex;
  gap:8px;
  align-items:stretch;
}
.ticker-add input[type="text"]{
  flex:1;
  padding:10px 12px;
  font-family:'Space Grotesk',sans-serif;
  font-size:14px;
  background:#1a1918;
  border:2px solid #454441;
  border-radius:6px;
  color:#f7f6f2;
}
.ticker-add input[type="text"]::placeholder{color:#6a6965}
.ticker-add input[type="text"]:focus{outline:none;border-color:#ffd54a}

/* ── BUTTONS ── */
.btn{
  font-family:'Space Mono',monospace;
  font-weight:700;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.06em;
  padding:10px 16px;
  border-radius:6px;
  border:2px solid #0a0a09;
  cursor:pointer;
  background:#1a1918;
  color:#c9c6bc;
  box-shadow:1px 1px 0 0 #0a0a09,2px 2px 0 0 #0a0a09,3px 3px 0 0 #0a0a09;
  transition:transform .08s ease,box-shadow .08s ease,background .12s ease,color .12s ease;
}
.btn:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 0 #0a0a09,2px 2px 0 0 #0a0a09;background:#221f1c;color:#f7f6f2}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 0 #0a0a09}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:1px 1px 0 0 #0a0a09,2px 2px 0 0 #0a0a09,3px 3px 0 0 #0a0a09;background:#1a1918;color:#c9c6bc}
.btn-primary{background:#ffd54a;color:#0a0a09}
.btn-primary:hover{background:#ffce30;color:#0a0a09}
.btn-primary.is-stop{background:#c43d3c;color:#f7f6f2}
.btn-primary.is-stop:hover{background:#a83231;color:#f7f6f2}

/* ── CUE LIST ── */
.cue-wrap{
  background:#141413;
  border:2px solid #353431;
  border-radius:8px;
  box-shadow:1px 1px 0 0 #050504,2px 2px 0 0 #050504,3px 3px 0 0 #050504;
  overflow:hidden;
}
.cue-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 14px;
  font-family:'Space Mono',monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#8a8883;
  border-bottom:1px solid #2a2a28;
  background:#1a1918;
}
.cue-count{color:#ffd54a;font-size:11px}
.cue-list{
  list-style:none;
  margin:0;
  padding:0;
  max-height:240px;
  overflow-y:auto;
}
.cue-empty{
  padding:18px 14px;
  text-align:center;
  color:#6a6965;
  font-size:13px;
}
.cue-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  border-bottom:1px solid #2a2a28;
}
.cue-item:last-child{border-bottom:none}
.cue-handle{
  font-family:'Space Mono',monospace;
  font-size:11px;
  font-weight:700;
  color:#5c5a55;
  width:28px;
  text-align:right;
  flex-shrink:0;
  letter-spacing:.04em;
}
.cue-text{
  flex:1;
  font-size:14px;
  color:#f7f6f2;
  word-break:break-word;
  line-height:1.35;
}
.cue-text-input{
  flex:1;
  padding:6px 8px;
  font-family:'Space Grotesk',sans-serif;
  font-size:14px;
  background:#1a1918;
  border:2px solid #ffd54a;
  border-radius:4px;
  color:#f7f6f2;
}
.cue-actions{
  display:flex;
  gap:4px;
  flex-shrink:0;
}
.qa-btn{
  font-family:'Space Mono',monospace;
  font-weight:700;
  font-size:12px;
  padding:5px 8px;
  min-width:28px;
  border-radius:4px;
  border:1px solid #454441;
  background:#1a1918;
  color:#c9c6bc;
  cursor:pointer;
  transition:background .12s ease,color .12s ease,border-color .12s ease;
}
.qa-btn:hover{background:#221f1c;color:#f7f6f2;border-color:#5c5a55}
.qa-btn:disabled{opacity:.3;cursor:not-allowed}
.qa-del:hover{background:#3a1f1f;color:#ff8b8b;border-color:#7a3030}
.qa-save{background:#1a2418;color:#7be09a;border-color:#3a6b3a}
.qa-save:hover{background:#243524;color:#a4f0bd;border-color:#4d8e4d}

/* ── SETTINGS ── */
.ticker-settings{
  display:flex;
  flex-wrap:wrap;
  gap:14px 18px;
  align-items:center;
  padding:10px 14px;
  background:#141413;
  border:2px solid #353431;
  border-radius:8px;
  box-shadow:1px 1px 0 0 #050504,2px 2px 0 0 #050504,3px 3px 0 0 #050504;
}
.ticker-settings label{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:'Space Mono',monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#8a8883;
}
.ticker-settings input[type="text"]{
  padding:6px 8px;
  font-family:'Space Grotesk',sans-serif;
  font-size:13px;
  background:#1a1918;
  border:2px solid #454441;
  border-radius:4px;
  color:#f7f6f2;
  width:140px;
  text-transform:uppercase;
  letter-spacing:.06em;
}
.ticker-settings input[type="text"]:focus{outline:none;border-color:#ffd54a}
.ticker-settings input[type="range"]{
  width:160px;
  accent-color:#ffd54a;
}
.speed-value{
  font-family:'Space Mono',monospace;
  font-size:11px;
  color:#c9c6bc;
  min-width:60px;
}

/* ── ACTIONS / HINT ── */
.ticker-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.hint{
  font-size:12px;
  color:#6a6965;
  line-height:1.5;
}
.hint kbd{
  font-family:'Space Mono',monospace;
  font-size:11px;
  padding:2px 6px;
  border-radius:4px;
  border:1px solid #454441;
  background:#1a1918;
}

/* ── STAGE (overlay safe zone) ── */
#stage-wrap{
  position:fixed;
  inset:0;
  pointer-events:none;
  display:flex;
  align-items:flex-end;
  justify-content:stretch;
  padding:24px 24px 36px 24px;
}
body:not(.obs-mode) #stage-wrap{padding-top:340px}

#stage{
  width:100%;
  display:flex;
  align-items:flex-end;
}
#stage:empty{display:none}

/* ── TICKER BAR ── */
.ticker-bar{
  position:relative;
  width:100%;
  display:flex;
  align-items:stretch;
  background:#141413;
  border:2px solid #454441;
  border-radius:8px;
  overflow:hidden;
  box-shadow:
    1px 1px 0 0 #050504,2px 2px 0 0 #050504,3px 3px 0 0 #050504,4px 4px 0 0 #050504,5px 5px 0 0 #050504,
    6px 6px 0 0 #050504,7px 7px 0 0 #050504,8px 8px 0 0 #050504,9px 9px 0 0 #050504,10px 10px 0 0 #050504;
  animation:tickerIn .42s cubic-bezier(.33,1,.68,1) both;
}
.ticker-bar.ticker-exit{
  animation:tickerOut .35s cubic-bezier(.55,0,.68,.06) forwards;
}

.ticker-tag{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:14px;
  padding:18px 26px;
  background:#ffd54a;
  color:#0a0a09;
  font-family:'Space Mono',monospace;
  font-weight:700;
  font-size:21px;
  letter-spacing:.08em;
  text-transform:uppercase;
  border-right:2px solid #0a0a09;
  z-index:2;
  box-shadow:2px 0 0 0 #0a0a09;
}
.ticker-tag-pulse{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#c43d3c;
  box-shadow:0 0 0 0 rgba(196,61,60,.6);
  animation:tickerTagPulse 1.4s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes tickerTagPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(196,61,60,.55);opacity:1}
  50%{box-shadow:0 0 0 7px rgba(196,61,60,0);opacity:.55}
}

.ticker-track{
  flex:1;
  position:relative;
  overflow:hidden;
  /* Edge fade keeps the loop seam from popping in/out. NOTE: mask-image
     forces the track onto its own compositor layer in Chromium and can
     stutter under low-FPS captures. If you see jank, set the OBS Browser
     Source to Custom 60 fps + hardware acceleration before changing this. */
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 24px),transparent);
          mask-image:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 24px),transparent);
}

.ticker-content{
  display:inline-flex;
  align-items:center;
  white-space:nowrap;
  font-family:'Space Grotesk',sans-serif;
  font-weight:500;
  font-size:26px;
  letter-spacing:-.005em;
  color:#f7f6f2;
  animation:tickerScroll var(--ticker-duration,30s) linear infinite;
  will-change:transform;
}

.ticker-text-block{
  display:inline-block;
  padding:16px 0;
}

.ticker-sep{
  display:inline-block;
  margin:0 26px;
  color:#ffd54a;
  font-weight:700;
  vertical-align:middle;
}

@keyframes tickerScroll{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}
@keyframes tickerIn{
  0%{opacity:0;transform:translateY(28px)}
  100%{opacity:1;transform:translateY(0)}
}
@keyframes tickerOut{
  0%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(28px)}
}
</style>
</head>
<body>
<div id="controls" aria-label="Ticker controls">
  <div class="controls-inner">
    <div class="controls-title">
      <span>News ticker — Syntax style</span>
      <span class="sync-status" id="sync-status" data-state="connecting" title="Connecting…">Connecting</span>
    </div>

    <form class="ticker-add" id="add-form" autocomplete="off">
      <input type="text" id="ticker-input" placeholder="Type an update and press Enter to cue it…" maxlength="240">
      <button type="submit" class="btn">Add</button>
    </form>

    <div class="cue-wrap">
      <div class="cue-header">
        <span>Cue list</span>
        <span class="cue-count" id="cue-count">0 items</span>
      </div>
      <ul class="cue-list" id="cue-list"></ul>
    </div>

    <div class="ticker-settings">
      <label>Tag <input type="text" id="setting-label" maxlength="20" value="UPDATES"></label>
      <label>Speed <input type="range" id="setting-speed" min="60" max="280" step="10" value="140"></label>
      <span class="speed-value" id="speed-value">140 px/s</span>
    </div>

    <div class="ticker-actions">
      <button type="button" class="btn btn-primary" id="play-btn" disabled>Start ticker</button>
      <button type="button" class="btn" id="clear-btn">Clear cue list</button>
    </div>

    <p class="hint">OBS: add the same page with <kbd>?obs</kbd> for a transparent overlay (no controls). Cue edits and start/stop sync over WebSocket to every connected page. Use <kbd>?session=…</kbd> to scope to a specific room.</p>
  </div>
</div>

<div id="stage-wrap">
  <div id="stage" aria-live="polite"></div>
</div>

<script>
(function(){
  'use strict';

  /*
   * News-style scrolling ticker. Operator panel + OBS overlay are the same
   * page in different modes (`?obs` switches modes).
   *
   * Transport: the Social Stream Ninja relay used as a generic peer pubsub
   * on a dedicated channel (in/out: 8). Every payload is wrapped in
   * `overlayNinja.syntaxTicker` so it cannot collide with featured-comment
   * traffic (channels 1–3) or lower-thirds traffic (channel 7).
   *
   * Sync model: each tab owns a local copy of state. User actions patch
   * state locally and broadcast a full snapshot. Receivers patch silently
   * (no rebroadcast — this is what stops echo loops). On connect a tab
   * sends `state-request`; tabs with non-empty state respond with their
   * snapshot. In the rare case two operators edit simultaneously the
   * later-broadcast snapshot wins.
   */

  /* ── URL PARAMS ── */
  var params = new URLSearchParams(location.search);
  if (params.has('obs') || params.has('overlay')) document.body.classList.add('obs-mode');

  var SYNC_SESSION = params.get('session') || params.get('s') || params.get('room') || 'syntax-ticker-default';
  var SYNC_URL = params.get('server') || (params.has('localserver') ? 'ws://127.0.0.1:3000' : 'wss://io.socialstream.ninja');
  var SYNC_CHANNEL = 8;
  var TAB_ID = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  var STORAGE_KEY = 'syntax-ticker:state:' + SYNC_SESSION;

  /* ── DOM REFS ── */
  var stage = document.getElementById('stage');
  var statusEl = document.getElementById('sync-status');
  var addForm = document.getElementById('add-form');
  var addInput = document.getElementById('ticker-input');
  var cueListEl = document.getElementById('cue-list');
  var cueCountEl = document.getElementById('cue-count');
  var labelInput = document.getElementById('setting-label');
  var speedInput = document.getElementById('setting-speed');
  var speedValueEl = document.getElementById('speed-value');
  var playBtn = document.getElementById('play-btn');
  var clearBtn = document.getElementById('clear-btn');

  /* ── STATE ──
     Replicated state (synced over the relay): queue, playing, settings.
     Local-only state (never synced): editingId and the render-skip caches. */
  var DEFAULT_SETTINGS = { label: 'UPDATES', speed: 80 };
  var state = {
    queue: [],          /* [{ id, text }] */
    playing: false,
    settings: Object.assign({}, DEFAULT_SETTINGS)
  };
  var editingId = null;
  var lastRenderedQueue = null;
  var lastRenderedEditingId = null;
  var lastBlockWidth = 0;          /* memoized so speed changes skip rebuild */

  /* ── PERSISTENCE ──
     Both operator and OBS modes cache the last known state to localStorage
     so a refresh feels instant. The cache is overwritten by the first
     sync message on reconnect, so it cannot drift for long. */
  function loadLocal(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var p = JSON.parse(raw);
      if (!p || typeof p !== 'object') return;
      if (Array.isArray(p.queue)){
        state.queue = p.queue.filter(function(q){ return q && typeof q.text === 'string' && q.id; });
      }
      if (typeof p.playing === 'boolean') state.playing = p.playing;
      if (p.settings && typeof p.settings === 'object'){
        if (typeof p.settings.label === 'string') state.settings.label = p.settings.label;
        if (typeof p.settings.speed === 'number') state.settings.speed = p.settings.speed;
      }
    } catch(e){}
  }
  function persistLocal(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch(e){}
  }

  function newId(){ return 'q_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }

  function esc(s){
    if (s == null || s === '') return '';
    var d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
  }

  /* ── WEBSOCKET SYNC ── */
  var ws = null;
  var wsReady = false;
  var conCon = 1;
  var reconnectTimer = null;

  function setSyncStatus(s, label){
    if (!statusEl) return;
    statusEl.setAttribute('data-state', s);
    statusEl.textContent = label || s.charAt(0).toUpperCase() + s.slice(1);
    statusEl.title = label || s;
  }

  function scheduleReconnect(){
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(function(){
      reconnectTimer = null;
      conCon = Math.min(conCon + 1, 30);
      connectSync();
    }, Math.min(150 * conCon, 5000));
  }

  function connectSync(){
    if (reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
    setSyncStatus('connecting', 'Connecting');
    try {
      ws = new WebSocket(SYNC_URL);
    } catch(e){
      scheduleReconnect();
      return;
    }
    ws.onopen = function(){
      conCon = 1;
      wsReady = true;
      try { ws.send(JSON.stringify({ join: SYNC_SESSION, in: SYNC_CHANNEL, out: SYNC_CHANNEL })); } catch(e){}
      setSyncStatus('connected', 'Live');
      /* Two-way handshake on connect: ask peers for state and also announce
         our own if we have something worth sharing. */
      send({ action: 'state-request' });
      if (state.queue.length || state.playing) broadcastState();
    };
    ws.onmessage = function(e){
      if (!e.data) return;
      try {
        var d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
        handleSyncMessage(d);
      } catch(err){}
    };
    ws.onclose = function(){
      wsReady = false;
      setSyncStatus('reconnecting', 'Reconnecting');
      scheduleReconnect();
    };
    ws.onerror = function(){
      try { ws.close(); } catch(e){}
    };
  }

  function send(payload){
    if (!wsReady || !ws) return;
    try {
      payload._tab = TAB_ID;
      ws.send(JSON.stringify({ overlayNinja: { syntaxTicker: payload } }));
    } catch(e){}
  }

  function broadcastState(){
    send({
      action: 'state',
      queue: state.queue,
      playing: state.playing,
      settings: state.settings
    });
  }

  function handleSyncMessage(d){
    if (!d || typeof d !== 'object') return;
    if ('overlayNinja' in d) d = d.overlayNinja;
    if (!d || typeof d !== 'object' || !d.syntaxTicker) return;
    var msg = d.syntaxTicker;
    if (!msg || typeof msg !== 'object') return;
    if (msg._tab === TAB_ID) return;

    if (msg.action === 'state-request'){
      if (state.queue.length || state.playing) broadcastState();
      return;
    }
    if (msg.action === 'state'){
      var nextQueue = Array.isArray(msg.queue)
        ? msg.queue.filter(function(q){ return q && typeof q.text === 'string' && q.id; })
        : state.queue;
      var nextSettings = Object.assign({}, state.settings, msg.settings || {});
      var nextPlaying = (typeof msg.playing === 'boolean') ? msg.playing : state.playing;
      applyState({ queue: nextQueue, playing: nextPlaying, settings: nextSettings }, { silent: true });
    }
  }

  /* ── STATE MUTATION ── */
  function applyState(patch, opts){
    var prevQueue = state.queue;
    var prevPlaying = state.playing;
    var prevLabel = state.settings.label;
    var prevSpeed = state.settings.speed;

    if (patch.queue !== undefined) state.queue = patch.queue;
    if (patch.playing !== undefined) state.playing = patch.playing;
    if (patch.settings !== undefined) state.settings = patch.settings;

    var queueChanged = state.queue !== prevQueue;
    var playingChanged = state.playing !== prevPlaying;
    var labelChanged = state.settings.label !== prevLabel;
    var speedChanged = state.settings.speed !== prevSpeed;

    if (!queueChanged && !playingChanged && !labelChanged && !speedChanged) return;

    persistLocal();
    renderControls();

    if (queueChanged || playingChanged){
      renderStage();
    } else {
      if (labelChanged) updateStageLabel();
      if (speedChanged) updateStageSpeed();
    }

    if (!opts || !opts.silent) broadcastState();
  }

  /* ── CONTROL RENDERING ── */
  function renderControls(){
    renderCueList();
    renderSettings();
    renderButtons();
  }

  function renderCueList(){
    if (lastRenderedQueue === state.queue && lastRenderedEditingId === editingId) return;
    lastRenderedQueue = state.queue;
    lastRenderedEditingId = editingId;

    if (!state.queue.length){
      cueListEl.innerHTML = '<li class="cue-empty">No updates queued. Type one above and press Enter.</li>';
    } else {
      var html = '';
      state.queue.forEach(function(item, idx){
        var isFirst = idx === 0;
        var isLast = idx === state.queue.length - 1;
        var isEditing = editingId === item.id;
        var num = (idx + 1).toString();
        if (num.length < 2) num = '0' + num;
        html += '<li class="cue-item" data-id="' + esc(item.id) + '">' +
          '<span class="cue-handle">' + num + '</span>' +
          (isEditing
            ? '<input type="text" class="cue-text-input" data-edit-id="' + esc(item.id) + '" value="' + esc(item.text) + '" maxlength="240">'
            : '<span class="cue-text">' + esc(item.text) + '</span>'
          ) +
          '<div class="cue-actions">' +
            '<button type="button" class="qa-btn qa-up" data-action="up" data-id="' + esc(item.id) + '"' + (isFirst ? ' disabled' : '') + ' aria-label="Move up">↑</button>' +
            '<button type="button" class="qa-btn qa-down" data-action="down" data-id="' + esc(item.id) + '"' + (isLast ? ' disabled' : '') + ' aria-label="Move down">↓</button>' +
            (isEditing
              ? '<button type="button" class="qa-btn qa-save" data-action="save" data-id="' + esc(item.id) + '">Save</button>' +
                '<button type="button" class="qa-btn qa-cancel" data-action="cancel" data-id="' + esc(item.id) + '">Cancel</button>'
              : '<button type="button" class="qa-btn qa-edit" data-action="edit" data-id="' + esc(item.id) + '">Edit</button>'
            ) +
            '<button type="button" class="qa-btn qa-del" data-action="delete" data-id="' + esc(item.id) + '" aria-label="Delete">×</button>' +
          '</div>' +
          '</li>';
      });
      cueListEl.innerHTML = html;
      if (editingId){
        var inp = cueListEl.querySelector('input[data-edit-id="' + editingId + '"]');
        if (inp){
          inp.focus();
          try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch(e){}
        }
      }
    }
    cueCountEl.textContent = state.queue.length + (state.queue.length === 1 ? ' item' : ' items');
  }

  function renderSettings(){
    /* Skip inputs that have focus so a remote sync update doesn't yank
       the value out from under an operator who is mid-typing. */
    if (document.activeElement !== labelInput) labelInput.value = state.settings.label;
    if (document.activeElement !== speedInput) speedInput.value = state.settings.speed;
    speedValueEl.textContent = state.settings.speed + ' px/s';
  }

  function renderButtons(){
    playBtn.disabled = state.queue.length === 0;
    if (state.playing){
      playBtn.textContent = 'Stop ticker';
      playBtn.classList.add('is-stop');
    } else {
      playBtn.textContent = 'Start ticker';
      playBtn.classList.remove('is-stop');
    }
  }

  /* ── STAGE / TICKER RENDERING ── */
  var SEP = '\u00A0\u00A0\u25C6\u00A0\u00A0';

  function clearStage(){
    var bar = stage.querySelector('.ticker-bar');
    if (!bar) return;
    bar.classList.add('ticker-exit');
    setTimeout(function(){
      if (bar.parentNode) bar.parentNode.removeChild(bar);
    }, 360);
  }

  function buildItemsHtml(){
    var items = state.queue.map(function(q){ return q.text.trim(); }).filter(Boolean);
    if (!items.length) return '';
    var html = '';
    items.forEach(function(t){
      html += esc(t) + '<span class="ticker-sep">\u25C6</span>';
    });
    return html;
  }

  function renderStage(){
    if (!state.playing || !state.queue.length){
      clearStage();
      return;
    }
    var bar = stage.querySelector('.ticker-bar');
    if (!bar){
      bar = document.createElement('div');
      bar.className = 'ticker-bar';
      bar.innerHTML =
        '<div class="ticker-tag">' +
          '<span class="ticker-tag-pulse"></span>' +
          '<span class="ticker-tag-text"></span>' +
        '</div>' +
        '<div class="ticker-track">' +
          '<div class="ticker-content"></div>' +
        '</div>';
      stage.appendChild(bar);
    }
    bar.classList.remove('ticker-exit');

    var tagText = bar.querySelector('.ticker-tag-text');
    tagText.textContent = state.settings.label || 'UPDATES';

    var content = bar.querySelector('.ticker-content');
    var unitHtml = buildItemsHtml();
    if (!unitHtml){
      clearStage();
      return;
    }

    /* Measure one unit, then repeat enough copies to fill the track. We
       need a content block at least as wide as the track so the
       duplicate-and-translate-50% loop has no visible gap. */
    var trackEl = bar.querySelector('.ticker-track');
    var trackWidth = trackEl.clientWidth || window.innerWidth;

    var measure = document.createElement('span');
    measure.className = 'ticker-text-block';
    measure.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:-9999px;font-family:\'Space Grotesk\',sans-serif;font-weight:500;font-size:26px;letter-spacing:-.005em;white-space:nowrap';
    measure.innerHTML = unitHtml;
    document.body.appendChild(measure);
    var unitWidth = measure.getBoundingClientRect().width;
    document.body.removeChild(measure);

    var repeats = Math.max(1, Math.ceil(trackWidth / Math.max(1, unitWidth)));
    var blockHtml = '';
    for (var i = 0; i < repeats; i++) blockHtml += unitHtml;

    /* Two identical blocks side-by-side scrolled by -50% gives a seam-free
       loop because the second block is at the position the first started. */
    content.innerHTML =
      '<span class="ticker-text-block">' + blockHtml + '</span>' +
      '<span class="ticker-text-block" aria-hidden="true">' + blockHtml + '</span>';

    var blockWidth = unitWidth * repeats;
    lastBlockWidth = blockWidth;
    updateStageSpeed();

    /* Restart the animation so a content rebuild always begins at frame 0
       instead of mid-cycle. */
    content.style.animation = 'none';
    void content.offsetWidth;
    content.style.animation = '';
  }

  function updateStageLabel(){
    var tagText = stage.querySelector('.ticker-tag-text');
    if (tagText) tagText.textContent = state.settings.label || 'UPDATES';
  }

  function updateStageSpeed(){
    var content = stage.querySelector('.ticker-content');
    if (!content || !lastBlockWidth) return;
    var duration = lastBlockWidth / Math.max(20, state.settings.speed);
    content.style.setProperty('--ticker-duration', duration.toFixed(2) + 's');
  }

  /* Re-measure on resize so the loop duration tracks the new viewport. */
  var resizeRaf = null;
  window.addEventListener('resize', function(){
    if (resizeRaf) cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(function(){
      resizeRaf = null;
      if (state.playing && state.queue.length) renderStage();
    });
  });

  /* ── CUE OPERATIONS ── */
  function addItem(text){
    var t = (text || '').trim();
    if (!t) return;
    var next = state.queue.concat([{ id: newId(), text: t }]);
    applyState({ queue: next });
  }

  function deleteItem(id){
    var next = state.queue.filter(function(q){ return q.id !== id; });
    if (editingId === id) editingId = null;
    applyState({ queue: next });
  }

  function moveItem(id, dir){
    var idx = -1;
    for (var i = 0; i < state.queue.length; i++){ if (state.queue[i].id === id){ idx = i; break; } }
    if (idx < 0) return;
    var swap = idx + (dir === 'up' ? -1 : 1);
    if (swap < 0 || swap >= state.queue.length) return;
    var next = state.queue.slice();
    var tmp = next[idx]; next[idx] = next[swap]; next[swap] = tmp;
    applyState({ queue: next });
  }

  function startEdit(id){
    editingId = id;
    /* Force a re-render even though the queue array reference is unchanged
       so the inline edit input mounts and takes focus. */
    lastRenderedEditingId = '__force__';
    renderCueList();
  }

  function saveEdit(id){
    var inp = cueListEl.querySelector('input[data-edit-id="' + id + '"]');
    if (!inp){ editingId = null; renderCueList(); return; }
    var t = inp.value.trim();
    var next;
    if (!t){
      next = state.queue.filter(function(q){ return q.id !== id; });
    } else {
      next = state.queue.map(function(q){ return q.id === id ? { id: q.id, text: t } : q; });
    }
    editingId = null;
    applyState({ queue: next });
  }

  function cancelEdit(){
    editingId = null;
    lastRenderedEditingId = '__force__';
    renderCueList();
  }

  function clearAll(){
    if (!state.queue.length && !state.playing) return;
    editingId = null;
    applyState({ queue: [], playing: false });
  }

  function togglePlay(){
    if (!state.playing && !state.queue.length) return;
    applyState({ playing: !state.playing });
  }

  /* ── EVENT WIRING ── */
  addForm.addEventListener('submit', function(e){
    e.preventDefault();
    addItem(addInput.value);
    addInput.value = '';
    addInput.focus();
  });

  cueListEl.addEventListener('click', function(e){
    var btn = e.target && e.target.closest && e.target.closest('.qa-btn');
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    var id = btn.getAttribute('data-id');
    if (action === 'up' || action === 'down') moveItem(id, action);
    else if (action === 'delete') deleteItem(id);
    else if (action === 'edit') startEdit(id);
    else if (action === 'save') saveEdit(id);
    else if (action === 'cancel') cancelEdit();
  });

  cueListEl.addEventListener('keydown', function(e){
    if (!editingId) return;
    var inp = e.target && e.target.closest && e.target.closest('.cue-text-input');
    if (!inp) return;
    if (e.key === 'Enter'){ e.preventDefault(); saveEdit(editingId); }
    else if (e.key === 'Escape'){ e.preventDefault(); cancelEdit(); }
  });

  labelInput.addEventListener('input', function(){
    var val = labelInput.value.toUpperCase().slice(0, 20);
    /* applyState compares object refs to detect change, so spread into a
       new object instead of mutating in place. */
    applyState({ settings: Object.assign({}, state.settings, { label: val }) });
  });

  /* `input` updates the displayed value live; `change` fires on release so
     we don't broadcast a WS message and rebuild the animation on every
     intermediate drag position. */
  speedInput.addEventListener('input', function(){
    var v = parseInt(speedInput.value, 10) || DEFAULT_SETTINGS.speed;
    speedValueEl.textContent = v + ' px/s';
  });
  speedInput.addEventListener('change', function(){
    var v = parseInt(speedInput.value, 10) || DEFAULT_SETTINGS.speed;
    applyState({ settings: Object.assign({}, state.settings, { speed: v }) });
  });

  playBtn.addEventListener('click', togglePlay);
  clearBtn.addEventListener('click', clearAll);

  /* ── INIT ── */
  loadLocal();
  renderControls();
  renderStage();
  connectSync();
})();
</script>
</body>
</html>
